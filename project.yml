name: HomeAssistantTV
options:
  bundleIdPrefix: uk.co.peterbraden
  deploymentTarget:
    tvOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: DCVZRG49FW

packages:
  HomeAssistantKit:
    path: HomeAssistantKit

targets:
  HomeAssistantTV:
    type: application
    platform: tvOS
    sources:
      - App/Sources
      - App/Resources
      - Shared
    dependencies:
      - package: HomeAssistantKit
      - target: TopShelf
    entitlements:
      path: App/HomeAssistantTV.entitlements
      properties:
        com.apple.security.application-groups: [group.uk.co.peterbraden.HomeAssistantTV]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Home Assistant
        CFBundleURLTypes:
          - CFBundleURLName: uk.co.peterbraden.HomeAssistantTV
            CFBundleURLSchemes: [homeassistanttv]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Automatic
        NSLocalNetworkUsageDescription: Home Assistant connects to your server on the local network.
        NSBonjourServices: [_home-assistant._tcp]
        NSAppTransportSecurity:
          # Home Assistant is commonly served over plain HTTP on the LAN.
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.peterbraden.HomeAssistantTV
        PRODUCT_NAME: HomeAssistantTV
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        CODE_SIGN_STYLE: Automatic

  TopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - TopShelf
      - Shared
    dependencies:
      - package: HomeAssistantKit
      - sdk: TVServices.framework
    entitlements:
      path: TopShelf/TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.uk.co.peterbraden.HomeAssistantTV]
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Home Assistant Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.peterbraden.HomeAssistantTV.TopShelf
        PRODUCT_NAME: TopShelf
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic

  HomeAssistantTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - UITests
    dependencies:
      - target: HomeAssistantTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.peterbraden.HomeAssistantTVUITests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "3"

schemes:
  HomeAssistantTV:
    build:
      targets:
        HomeAssistantTV: all
    test:
      targets:
        - HomeAssistantTVUITests
